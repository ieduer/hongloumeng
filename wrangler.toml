name = "hongloumeng"
pages_build_output_dir = ".release-output/hongloumeng"
compatibility_date = "2025-03-24"

[[services]]
binding = "GROWTH_EVIDENCE"
service = "bdfz-user-center"
entrypoint = "HlmGrowthEvidence"

# AI route (functions/api/ai.js, 2026-11-18): the shared gateway through a service binding, called with this site's own
# caller credential (secret APIS_CALLER_TOKEN, set on the Pages project; never in this file).
[[services]]
binding = "APIS"
service = "apis"

# Per-client rate guard of the AI route: one-minute counters under hashed keys (functions/_shared/ai-rate-guard.js).
# Shared namespace "ai-rate-guard"; keys are prefixed with the site.
[[kv_namespaces]]
binding = "AI_RATE_KV"
id = "88ca57c8cb534d539b959e29617e6fa6"

# 石頭收服（/play）學習資料：對局、逐題作答、雲端存檔。只存學習資料，不存個人資料
# （身分只記 my.bdfz.net 的 slug 或匿名 cookie id）。結構見 migrations/0001_play.sql。
[[d1_databases]]
binding = "PLAY_DB"
database_name = "hongloumeng-play"
database_id = "312b6340-d35c-40ee-84a8-e0216e9ae3ee"
