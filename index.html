<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://raw.githubusercontent.com/gptv/suen/main/images/Avatar-small.jpeg" type="image/jpeg">
    <!-- Favicon links -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <title>AI红楼梦</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "qylogg7onq");
    </script>
</head>
<body>
    <div id="container">
        <aside id="sidebar">
            <button id="menu-label-btn" class="ghibli-button toggle-menu">目錄</button>
            <div id="chapter-menu-container">
                 <nav id="chapter-menu"></nav>
            </div>
        </aside>

        <div id="main-content">
            <header>
                <h1>AI红楼梦</h1>
                <button id="toggle-dark-btn" title="切換夜晚模式" class="ghibli-button dark-mode-toggle">🌓</button>
            </header>

            <section id="dialogue-box">
                <div id="messages">
                    <!-- 內容由 JS 加載 -->
                </div>
                <div id="input-area">
                    <input type="text" id="user-input" placeholder="與曹雪芹聊聊紅樓夢..." aria-label="在此輸入訊息">
                    <button id="chat-button" class="ghibli-button chat">發送</button>
                </div>
            </section>

            <section id="riddle-area" class="hidden">
                <h3>章回謎題</h3>
                <p id="riddle-scenario"></p>
                <div id="riddle-hints"></div>
                <div id="riddle-input-box">
                    <input type="text" id="riddle-input" placeholder="輸入關鍵詞提問">
                    <button id="riddle-ask-btn" class="ghibli-button">詢問</button>
                    <button id="riddle-reveal-btn" class="ghibli-button">揭曉答案</button>
                </div>
                <p id="riddle-response"></p>
                <p id="riddle-scoreboard"></p>
            </section>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <!-- target="_blank" and rel="noopener noreferrer" ensure link opens in new tab securely -->
        <p>© Suen <a href="https://bdfz.net/posts/hlm" target="_blank" rel="noopener noreferrer">About</a></p>
    </footer>

    <script src="assets/js/app.js"></script>
</body>
</html>
